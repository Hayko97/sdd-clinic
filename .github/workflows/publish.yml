name: Publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version/tag to publish (for example 0.1.0)
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Validate release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const p=require("./package.json"); if(p.version!==process.env.RELEASE_VERSION)throw Error("Version mismatch")'
          test "$(git rev-list -n 1 "v$RELEASE_VERSION")" = "$(git rev-parse HEAD)"
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm pack:release
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Dockerfile.cli
          platforms: linux/amd64,linux/arm64
          push: true
          tags: sintyoa/sdd-clinic:${{ inputs.version }},sintyoa/sdd-clinic:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Hayko97/sdd-clinic
            org.opencontainers.image.licenses=MIT
      - name: Publish npm with configured trusted publisher
        run: npm publish releases/*.tgz --access public --provenance
